version: 1

# Semântica de matching (sem pipeline de ingestão implementado — spec validável)
matching:
  engine: pathlib-glob
  root: repository-root
  semantics: |
    Include: pathlib.Path.glob(pattern) a partir da raiz do repositório GaabWiki.
    Suporta ** recursivo (Python 3.11+). Paths normalizados em POSIX (forward slashes).
    Exclude: pathlib.PurePosixPath(path).match(pattern) — exclude tem precedência sobre include.
    Consumidores futuros devem implementar esta semântica; fnmatch simples NÃO é válido para **.

corpora:
  current:
    include:
      - ".ai/wiki/**/*.md"
      - "KernelBot/wiki/**/*.md"
      - "OrbitBot/wiki/**/*.md"
      - "ISS/wiki/**/*.md"
      - "Portifolio/wiki/**/*.md"
      - "Xray-Spec/wiki/**/*.md"
      - ".ai/index.md"
      - "KernelBot/index.md"
      - "OrbitBot/index.md"
      - "ISS/index.md"
      - "Portifolio/index.md"
      - "Xray-Spec/index.md"
    description: "Conhecimento sintetizado e atual"

  sources:
    include:
      - "**/raw/**/*.md"
      - "**/raw/**/*.txt"
      - "README.md"
      - "**/CLAUDE.md"
    description: "Fontes primárias e evidências preservadas"

  history:
    include:
      - "**/archive/**/*.md"
      - "**/log.md"
    description: "Histórico e registros de mudança"

exclude:
  - "**/.obsidian/**"
  - "**/.git/**"
  - "**/.github/**"
  - "**/node_modules/**"
  - "**/__pycache__/**"
  - "**/*.tmp"
  - "**/*.bak"
  - "**/*.log"
  - "**/*.cache"
  - "**/.DS_Store"
  - "Portifolio/.ai/wiki/**"
  - "Portifolio/.ai/index.md"
  - "Portifolio/.ai/**"
  - "KernelBot/raw/docs-wiki/**"

invariants:
  - "Cada página importante deve possuir id único"
  - "Ferramentas de sindicação de RAG não devem ser implementadas neste corpus"
  - "Raw é evidência, não conhecimento sintetizado"
  - "Histórico deve permanecer separado do corpus atual"
  - "Links e relações devem ser explícitos"
  - "SUPERSEDED (Portifolio/.ai/) nunca entra no corpus current"
